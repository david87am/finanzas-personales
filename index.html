<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Finanzas Personales</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ─── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:        #f5f5f4;
  --surface:   #ffffff;
  --surface2:  #f0efed;
  --surface3:  #e8e7e4;
  --border:    rgba(0,0,0,.09);
  --text:      #1a1a18;
  --text2:     #6b6b67;
  --text3:     #a3a39e;
  --accent:    #1a1a18;
  --accent-fg: #ffffff;
  --green:     #1a7f4e;
  --green-bg:  #d4f1e3;
  --red:       #c1350b;
  --red-bg:    #fde0d6;
  --yellow:    #8a5c06;
  --yellow-bg: #fef3c7;
  --blue:      #1d4ed8;
  --blue-bg:   #dbeafe;
  --radius:    10px;
  --radius-sm: 6px;
  --shadow:    0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.12);
  --sidebar-w: 220px;
  --topbar-h:  52px;
  --font:      'Hanken Grotesk', system-ui, sans-serif;
  --mono:      'IBM Plex Mono', monospace;
  --tr:        160ms ease;
}
[data-theme="dark"] {
  --bg:        #0f0f0e;
  --surface:   #1a1a18;
  --surface2:  #222220;
  --surface3:  #2e2e2b;
  --border:    rgba(255,255,255,.08);
  --text:      #f0f0ed;
  --text2:     #a0a09a;
  --text3:     #5c5c58;
  --accent:    #efefec;
  --accent-fg: #111110;
  --green:     #3dba7e;
  --green-bg:  #0a2318;
  --red:       #f47c5a;
  --red-bg:    #2d1008;
  --yellow:    #f5a623;
  --yellow-bg: #281c04;
  --blue:      #60a5fa;
  --blue-bg:   #0f1f3d;
  --shadow:    0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.6);
}
@media (prefers-color-scheme: dark) {
  [data-theme="auto"] {
    --bg:#0f0f0e;--surface:#1a1a18;--surface2:#222220;--surface3:#2e2e2b;
    --border:rgba(255,255,255,.08);--text:#f0f0ed;--text2:#a0a09a;--text3:#5c5c58;
    --accent:#efefec;--accent-fg:#111110;--green:#3dba7e;--green-bg:#0a2318;
    --red:#f47c5a;--red-bg:#2d1008;--yellow:#f5a623;--yellow-bg:#281c04;
    --blue:#60a5fa;--blue-bg:#0f1f3d;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);
    --shadow-lg:0 8px 32px rgba(0,0,0,.6);
  }
}

/* ─── RESET ──────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:var(--font);cursor:pointer;border:none;background:none}
input,select,textarea{font-family:var(--font);color:var(--text)}
a{color:inherit;text-decoration:none}
ul{list-style:none}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

/* ─── LAYOUT ─────────────────────────────────────────────── */
.layout{display:flex;min-height:100dvh}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.pages{flex:1}
.page{display:none;padding:1.75rem 1.5rem;max-width:1060px;margin:0 auto}
.page.active{display:block;animation:fadeUp .2s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ─── SIDEBAR ────────────────────────────────────────────── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  height:100dvh;position:sticky;top:0;
  display:flex;flex-direction:column;
  background:var(--surface);
  border-right:.5px solid var(--border);
  overflow-y:auto;overflow-x:hidden;
  z-index:100;
}
.sidebar-brand{
  display:flex;align-items:center;gap:.6rem;
  padding:1.1rem 1rem .9rem;
  font-size:.95rem;font-weight:700;letter-spacing:-.02em;
  border-bottom:.5px solid var(--border);
  color:var(--text);
}
.brand-icon{font-size:1.1rem}
.sidebar-nav{flex:1;padding:.5rem .5rem 0}
.sidebar-footer{padding:.5rem .5rem .75rem;border-top:.5px solid var(--border)}
.sidebar-btn{
  display:flex;align-items:center;gap:.65rem;width:100%;
  padding:.6rem .75rem;border-radius:var(--radius-sm);
  font-size:.82rem;font-weight:500;color:var(--text2);
  transition:background var(--tr),color var(--tr);
  white-space:nowrap;text-align:left;
}
.sidebar-btn:hover{background:var(--surface2);color:var(--text)}
.sidebar-btn.active{background:var(--accent);color:var(--accent-fg)}
.sidebar-btn.cargar-btn{
  font-weight:600;font-size:.84rem;
  margin-bottom:.25rem;
}
.nav-icon{font-size:.95rem;width:1.1rem;text-align:center;flex-shrink:0}

/* ─── TOPBAR ─────────────────────────────────────────────── */
.topbar{
  height:var(--topbar-h);
  display:flex;align-items:center;
  padding:0 1.25rem;gap:.75rem;
  background:var(--surface);
  border-bottom:.5px solid var(--border);
  position:sticky;top:0;z-index:90;
}
.hamburger{
  display:none;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:var(--radius-sm);
  color:var(--text2);flex-shrink:0;
}
.hamburger:hover{background:var(--surface2);color:var(--text)}
.topbar-title{
  font-size:.88rem;font-weight:600;letter-spacing:-.01em;
  flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar-right{display:flex;align-items:center;gap:.4rem;margin-left:auto}
.topbar-btn{
  display:flex;align-items:center;justify-content:center;gap:.3rem;
  height:32px;padding:0 .65rem;
  border-radius:var(--radius-sm);
  font-size:.75rem;font-weight:500;color:var(--text2);
  transition:background var(--tr),color var(--tr);
  white-space:nowrap;position:relative;
}
.topbar-btn:hover{background:var(--surface2);color:var(--text)}
.tc-btn{font-family:var(--mono);font-size:.72rem}
.bell-badge{
  position:absolute;top:-4px;right:-4px;
  min-width:16px;height:16px;
  background:var(--red);color:#fff;
  font-size:.6rem;font-weight:700;
  border-radius:99px;
  display:flex;align-items:center;justify-content:center;
  padding:0 3px;
}
.theme-btn{font-size:.85rem;width:32px;padding:0}

/* ─── SIDEBAR OVERLAY (mobile) ───────────────────────────── */
.sidebar-overlay{
  display:none;position:fixed;inset:0;z-index:99;
  background:rgba(0,0,0,.4);backdrop-filter:blur(2px);
}
.sidebar-overlay.show{display:block}

/* ─── NOTIFICATION PANEL ─────────────────────────────────── */
.notif-panel{
  position:fixed;
  top:calc(var(--topbar-h) + 6px);
  right:.75rem;
  width:340px;max-height:65vh;
  overflow-y:auto;
  background:var(--surface);
  border:.5px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  z-index:200;
  display:none;
}
.notif-panel.open{display:block;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.notif-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.85rem 1rem .75rem;
  border-bottom:.5px solid var(--border);
  font-size:.82rem;font-weight:600;
}
.notif-body{padding:.5rem}
.notif-item{
  display:flex;align-items:flex-start;gap:.65rem;
  padding:.6rem .5rem;border-radius:var(--radius-sm);
  font-size:.8rem;line-height:1.4;
  transition:background var(--tr);
}
.notif-item:hover{background:var(--surface2)}
.notif-icon{font-size:.9rem;flex-shrink:0;margin-top:1px}
.notif-text{flex:1}
.notif-text strong{font-weight:600;display:block}
.notif-text span{color:var(--text3);font-size:.74rem}
.notif-amount{font-family:var(--mono);font-size:.72rem;color:var(--text3);white-space:nowrap}
.notif-empty{padding:1.5rem;text-align:center;color:var(--text3);font-size:.82rem}

/* ─── TOAST ──────────────────────────────────────────────── */
#toast-container{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast{
  padding:.65rem 1rem;border-radius:var(--radius-sm);
  font-size:.82rem;font-weight:500;
  box-shadow:var(--shadow-lg);pointer-events:auto;
  opacity:0;transform:translateY(6px);
  transition:opacity .2s ease,transform .2s ease;
  max-width:320px;
}
.toast.show{opacity:1;transform:none}
.toast-success{background:var(--accent);color:var(--accent-fg)}
.toast-error{background:var(--red);color:#fff}
.toast-warn{background:var(--yellow-bg);color:var(--yellow);border:.5px solid var(--yellow)}

/* ─── SKELETON ───────────────────────────────────────────── */
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
.skel{
  display:block;border-radius:4px;
  background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 50%,var(--surface2) 75%);
  background-size:600px 100%;
  animation:shimmer 1.4s linear infinite;
}

/* ─── CARDS ──────────────────────────────────────────────── */
.card{
  background:var(--surface);border:.5px solid var(--border);
  border-radius:var(--radius);padding:1.25rem;box-shadow:var(--shadow);
}
.card-grid{display:grid;gap:1rem}
.cols2{grid-template-columns:repeat(2,1fr)}
.cols3{grid-template-columns:repeat(3,1fr)}
.cols4{grid-template-columns:repeat(4,1fr)}

/* ─── STAT CARDS ─────────────────────────────────────────── */
.stat-card{display:flex;flex-direction:column;gap:.3rem}
.stat-label{font-size:.72rem;font-weight:500;color:var(--text2);letter-spacing:.01em}
.stat-value{font-family:var(--mono);font-size:1.45rem;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.2}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-sub{font-size:.7rem;color:var(--text3);font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ─── TABLES ─────────────────────────────────────────────── */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:.5px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.8rem}
thead th{
  background:var(--surface2);padding:.6rem .9rem;
  text-align:left;font-size:.68rem;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--text3);
  white-space:nowrap;
}
tbody tr{border-top:.5px solid var(--border)}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:.65rem .9rem;color:var(--text);vertical-align:middle}
.td-mono{font-family:var(--mono);font-size:.78rem;font-variant-numeric:tabular-nums}
.td-right{text-align:right}
.td-center{text-align:center}

/* ─── BUTTONS ────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.5rem .9rem;border-radius:var(--radius-sm);
  font-size:.8rem;font-weight:500;transition:all var(--tr);white-space:nowrap;
}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{border:.5px solid var(--border);color:var(--text2);background:var(--surface)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn-danger:hover{opacity:.8}
.btn-sm{padding:.3rem .6rem;font-size:.74rem}

/* ─── BADGES & CHIPS ─────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;
  font-size:.68rem;font-weight:600;padding:.18rem .5rem;
  border-radius:99px;white-space:nowrap;
}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.yellow{background:var(--yellow-bg);color:var(--yellow)}
.badge.blue{background:var(--blue-bg);color:var(--blue)}
.chip{
  display:inline-block;padding:.12rem .45rem;
  border-radius:99px;font-size:.7rem;font-weight:500;
  background:var(--surface2);color:var(--text2);
}

/* ─── PROGRESS ───────────────────────────────────────────── */
.progress-wrap{display:flex;flex-direction:column;gap:.35rem}
.progress-bg{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:var(--green);transition:width .5s cubic-bezier(.4,0,.2,1)}
.progress-fill.warn{background:var(--yellow)}
.progress-fill.over{background:var(--red)}

/* ─── FORMS ──────────────────────────────────────────────── */
.form-grid{display:flex;flex-direction:column;gap:.75rem}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.field{display:flex;flex-direction:column;gap:.28rem}
.field label{font-size:.72rem;font-weight:600;color:var(--text2);letter-spacing:.01em}
.field input,.field select,.field textarea{
  padding:.5rem .7rem;background:var(--surface);
  border:.5px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);font-size:.82rem;transition:border-color var(--tr);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field select option{background:var(--surface)}
.filter-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end}

/* ─── MODALS ─────────────────────────────────────────────── */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:1rem;
}
.modal-overlay.open{display:flex;animation:fadeIn .18s ease}
.modal{
  background:var(--surface);border:.5px solid var(--border);
  border-radius:var(--radius);padding:1.5rem;
  width:100%;max-width:480px;box-shadow:var(--shadow-lg);
  animation:slideUp .2s ease;
}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.modal-title{font-size:.95rem;font-weight:600;letter-spacing:-.01em}
.modal-close{color:var(--text3);font-size:1rem;padding:.25rem;border-radius:4px;line-height:1}
.modal-close:hover{color:var(--text);background:var(--surface2)}
.modal-footer{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem}

/* ─── MISC ───────────────────────────────────────────────── */
.flex-between{display:flex;align-items:center;justify-content:space-between}
.flex{display:flex;align-items:center}
.gap-sm{gap:.5rem}
.gap{gap:1rem}
.mb{margin-bottom:1rem}
.mb2{margin-bottom:1.5rem}
.mt{margin-top:1rem}
.text-green{color:var(--green)}
.text-red{color:var(--red)}
.text-muted{color:var(--text3)}
.page-title{font-size:1.2rem;font-weight:700;letter-spacing:-.02em}
.section-label{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:.6rem}
.divider{height:.5px;background:var(--border);margin:1.25rem 0}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3)}
.empty-icon{font-size:2rem;margin-bottom:.6rem}
.empty-text{font-size:.82rem}
.row-actions{display:flex;gap:.3rem;opacity:0;transition:opacity var(--tr)}
tbody tr:hover .row-actions{opacity:1}

/* ─── ALERT ITEMS ────────────────────────────────────────── */
.alert-list{display:flex;flex-direction:column;gap:.4rem}
.alert-item{
  display:flex;align-items:center;gap:.65rem;
  padding:.65rem .85rem;border-radius:var(--radius-sm);
  font-size:.8rem;border:.5px solid transparent;
}
.alert-item.red{background:var(--red-bg);color:var(--red)}
.alert-item.yellow{background:var(--yellow-bg);color:var(--yellow)}
.alert-item.green{background:var(--green-bg);color:var(--green)}
.alert-icon{flex-shrink:0}
.alert-text{flex:1}
.alert-text strong{font-weight:600}
.alert-monto{font-family:var(--mono);font-size:.72rem;opacity:.85;font-variant-numeric:tabular-nums}

/* ─── CARGAR PAGE ────────────────────────────────────────── */
.cargar-wrap{max-width:520px;margin:0 auto;padding-top:1rem}
.type-toggle{
  display:flex;background:var(--surface2);
  border-radius:99px;padding:3px;
  width:fit-content;margin-bottom:1.75rem;
}
.type-btn{
  padding:.45rem 1.75rem;border-radius:99px;
  font-size:.84rem;font-weight:600;color:var(--text2);
  transition:all var(--tr);font-family:var(--font);
}
.type-btn.active.gasto{background:var(--surface);color:var(--red);box-shadow:var(--shadow)}
.type-btn.active.ingreso{background:var(--surface);color:var(--green);box-shadow:var(--shadow)}
.monto-wrap{
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  padding:1.75rem 1.5rem;
  border-radius:var(--radius);
  background:var(--surface);border:.5px solid var(--border);
  margin-bottom:1.25rem;
}
.monto-symbol{font-family:var(--mono);font-size:2.2rem;color:var(--text3);line-height:1;flex-shrink:0}
.monto-input{
  font-family:var(--mono);font-size:2.8rem;font-weight:500;
  font-variant-numeric:tabular-nums;
  color:var(--text);background:transparent;border:none;outline:none;
  width:100%;text-align:center;line-height:1;
}
.monto-input::placeholder{color:var(--text3)}
.cargar-form{
  background:var(--surface);border:.5px solid var(--border);
  border-radius:var(--radius);padding:1.25rem;
}
.btn-cargar{
  width:100%;justify-content:center;
  padding:.75rem;font-size:.88rem;font-weight:600;
  margin-top:.75rem;border-radius:var(--radius-sm);
}

/* ─── CHARTS ─────────────────────────────────────────────── */
.charts-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:1rem}
.chart-wrap{position:relative;height:220px}

/* ─── META CARD ──────────────────────────────────────────── */
.meta-card{
  background:var(--surface);border:.5px solid var(--border);
  border-radius:var(--radius);padding:1.25rem;
  display:flex;flex-direction:column;gap:.75rem;
}

/* ─── PROJECTION TABLE ───────────────────────────────────── */
.proj-section{
  background:var(--surface);border:.5px solid var(--border);
  border-radius:var(--radius);padding:1.25rem;margin-top:1rem;
}

/* ─── RESPONSIVE ─────────────────────────────────────────── */
@media(max-width:900px){
  .charts-grid{grid-template-columns:1fr}
  .cols4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;
    transform:translateX(-100%);
    transition:transform .25s ease;
    z-index:200;
  }
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:flex}
  .page{padding:1.25rem 1rem}
  .cols3{grid-template-columns:repeat(2,1fr)}
  .row-actions{opacity:1}
}
@media(max-width:540px){
  .form-row-2{grid-template-columns:1fr}
  .cols2{grid-template-columns:1fr}
  .cols4{grid-template-columns:1fr 1fr}
  .type-btn{padding:.4rem 1.2rem}
  .monto-input{font-size:2.2rem}
}
</style>
</head>
<body>

<div class="layout">
  <!-- ─── SIDEBAR ─── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="brand-icon">💰</span><span>Finanzas</span></div>
    <nav class="sidebar-nav">
      <button class="sidebar-btn cargar-btn active" data-page="cargar"><span class="nav-icon">⚡</span><span>Cargar</span></button>
      <button class="sidebar-btn" data-page="dashboard"><span class="nav-icon">📊</span><span>Dashboard</span></button>
      <button class="sidebar-btn" data-page="movimientos"><span class="nav-icon">💳</span><span>Movimientos</span></button>
      <button class="sidebar-btn" data-page="deudas"><span class="nav-icon">💸</span><span>Deudas</span></button>
      <button class="sidebar-btn" data-page="cuotas"><span class="nav-icon">📆</span><span>Cuotas</span></button>
      <button class="sidebar-btn" data-page="metas"><span class="nav-icon">🎯</span><span>Metas</span></button>
      <button class="sidebar-btn" data-page="recordatorios"><span class="nav-icon">🔔</span><span>Recordatorios</span></button>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-btn" data-page="config"><span class="nav-icon">⚙️</span><span>Configuración</span></button>
    </div>
  </aside>

  <!-- ─── MAIN ─── -->
  <div class="main-wrap">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menú">☰</button>

<script>
// ─── CONSTANTES ────────────────────────────────────────────
const API = "https://script.google.com/macros/s/AKfycbywSgOuEryn2bf7LvRLKIGk_AGrYd18YLo8L8KdvaL8YLIxUOaRvIMiBeb3BxjjyvrN/exec";

const PAGE_TITLES = {
  cargar:'Cargar movimiento', dashboard:'Dashboard',
  movimientos:'Movimientos', deudas:'Deudas', cuotas:'Cuotas',
  metas:'Metas', recordatorios:'Recordatorios', config:'Configuración',
};

// ─── ESTADO ────────────────────────────────────────────────
let _cats       = null;
let _dashData   = null;
let _deudasData = null;
let _chartDonut = null;
let _chartBars  = null;
let _chartData  = null;
let _cargarTipo = 'Gasto';
let _confirmRes = null;
let _currentTheme = localStorage.getItem('theme') || 'auto';

// ─── FORMATO ───────────────────────────────────────────────
const fmtARS  = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);
const fmtUSD  = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'USD',minimumFractionDigits:2}).format(n||0);
const fmtNum  = (n,m) => m==='USD' ? fmtUSD(n) : fmtARS(n);
const fmtDate = d => { if(!d) return '—'; const x=new Date(d); return isNaN(x)?d:x.toLocaleDateString('es-AR'); };
const today   = () => new Date().toISOString().split('T')[0];
const cssVar  = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ─── API ───────────────────────────────────────────────────
async function apiGet(params) {
  const res = await fetch(API + '?' + new URLSearchParams(params));
  return res.json();
}
async function apiPost(data) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(data),
  });
  return res.json();
}

// ─── TEMA ─────────────────────────────────────────────────
const THEME_ICONS = { light:'☀️', dark:'🌙', auto:'⚙️' };
const THEME_CYCLE = { light:'dark', dark:'auto', auto:'light' };

function applyTheme(t) {
  _currentTheme = t;
  localStorage.setItem('theme', t);
  document.documentElement.dataset.theme = t;
  document.getElementById('theme-btn').textContent = THEME_ICONS[t];
  if (_chartData) setTimeout(renderCharts, 50);
}
function cycleTheme() { applyTheme(THEME_CYCLE[_currentTheme]); }

// ─── TOAST ────────────────────────────────────────────────
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  requestAnimationFrame(() => { requestAnimationFrame(() => el.classList.add('show')); });
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

// ─── CONFIRM DIALOG ────────────────────────────────────────
function confirmDialog(msg, label = 'Eliminar') {
  return new Promise(resolve => {
    _confirmRes = resolve;
    document.getElementById('confirm-msg').textContent = msg;
    document.getElementById('confirm-ok').textContent = label;
    openModal('modal-confirm');
  });
}
document.getElementById('confirm-ok').addEventListener('click', () => {
  closeModal('modal-confirm');
  if (_confirmRes) { _confirmRes(true); _confirmRes = null; }
});
document.getElementById('confirm-cancel').addEventListener('click', () => {
  closeModal('modal-confirm');
  if (_confirmRes) { _confirmRes(false); _confirmRes = null; }
});

// ─── SKELETONS ────────────────────────────────────────────
function skelCards(n=4) {
  return `<div class="card-grid cols${n} mb2">${Array(n).fill(0).map(()=>`
    <div class="card stat-card">
      <span class="skel" style="height:11px;width:55%;margin-bottom:6px"></span>
      <span class="skel" style="height:26px;width:75%"></span>
    </div>`).join('')}</div>`;
}
function skelTable(rows=5, cols=5) {
  const cells = Array(cols).fill(0).map(()=>`<td><span class="skel" style="height:13px;width:${50+Math.random()*40}%"></span></td>`).join('');
  return `<div class="table-wrap"><table><tbody>${Array(rows).fill(0).map(()=>`<tr>${cells}</tr>`).join('')}</tbody></table></div>`;
}
function skelCards2(n=4) {
  return `<div class="card-grid cols2">${Array(n).fill(0).map(()=>`
    <div class="card">
      <span class="skel" style="height:13px;width:60%;margin-bottom:10px"></span>
      <span class="skel" style="height:8px;width:100%;margin-bottom:6px"></span>
      <span class="skel" style="height:8px;width:80%"></span>
    </div>`).join('')}</div>`;
}

// ─── MODALES ──────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

// ─── NAVEGACIÓN ───────────────────────────────────────────
function navigate(page) {
  document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('topbar-title').textContent = PAGE_TITLES[page] || page;
  // close sidebar on mobile
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
  loadPage(page);
}

function loadPage(page) {
  switch(page) {
    case 'dashboard':     loadDashboard();     break;
    case 'movimientos':   loadMovimientos();   break;
    case 'deudas':        loadDeudas();        break;
    case 'cuotas':        loadCuotas();        break;
    case 'metas':         loadMetas();         break;
    case 'recordatorios': loadRecordatorios(); break;
    case 'config':        loadConfig();        break;
    case 'cargar':        /* already loaded */ break;
  }
}

document.querySelectorAll('.sidebar-btn[data-page]').forEach(btn => {
  btn.addEventListener('click', () => navigate(btn.dataset.page));
});

function updateBell(dash, deudasArr) {
  const items = [];
  (dash.recordatoriosProximos || []).forEach(r => {
    const cls = r.diasRestantes <= 0 ? '🔴' : '🟡';
    const cuando = r.diasRestantes <= 0 ? 'Vencido' : `en ${r.diasRestantes}d`;
    items.push({ icon: cls, title: r['Título'], sub: cuando, monto: fmtNum(r['Monto Estimado'], r['Moneda']), urgent: r.diasRestantes <= 0 });
  });
  (dash.cuotasProximas || []).forEach(c => {
    items.push({ icon: '💳', title: c['Descripción'], sub: `cuota ${c['Cuota Nº']}/${c['Total Cuotas']} · ${fmtDate(c['Próximo Vencimiento'])}`, monto: fmtNum(c['Monto por Cuota'], c['Moneda']), urgent: false });
  });
  (deudasArr || []).forEach(d => {
    const saldo = (parseFloat(d['Monto Original'])||0) - (parseFloat(d['Monto Pagado'])||0);
    if (d.estado === 'Vencido' && saldo > 0) {
      items.push({ icon: '🔴', title: d['Descripción'], sub: `Deuda vencida · ${d['Acreedor/Deudor']||''}`, monto: fmtNum(saldo, d['Moneda']), urgent: true });
    }
  });

  const badge = document.getElementById('bell-badge');
  if (items.length) {
    badge.textContent = items.length;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }

  const body = document.getElementById('notif-body');
  if (!items.length) {
    body.innerHTML = '<div class="notif-empty">✅ Sin alertas activas</div>';
  } else {
    body.innerHTML = items.map(i => `
      <div class="notif-item">
        <span class="notif-icon">${i.icon}</span>
        <div class="notif-text"><strong>${i.title}</strong><span>${i.sub}</span></div>
        <span class="notif-amount">${i.monto}</span>
      </div>`).join('');
  }
}

async function getCats() {
  if (!_cats) {
    const r = await apiGet({ action: 'getCategorias' });
    _cats = r.data || [];
  }
  return _cats;
}

async function fillCatSelect(selId, tipo = null) {
  const cats = await getCats();
  const sel  = document.getElementById(selId);
  const list = tipo ? cats.filter(c => c.tipo === tipo) : cats;
  sel.innerHTML = list.map(c => `<option value="${c.nombre}">${c.icono} ${c.nombre}</option>`).join('');
}

async function updateSubcat(catId, subcatId) {
  const cats    = await getCats();
  const catName = document.getElementById(catId).value;
  const cat     = cats.find(c => c.nombre === catName);
  const sel     = document.getElementById(subcatId);
  sel.innerHTML = cat ? cat.subcategorias.map(s => `<option value="${s}">${s}</option>`).join('') : '';
}

async function saveCargar() {
  const monto = parseFloat(document.getElementById('cargar-monto').value);
  const desc  = document.getElementById('cargar-desc').value.trim();
  if (!monto || monto <= 0) { toast('Ingresá un monto válido', 'error'); return; }
  if (!desc) { toast('Ingresá una descripción', 'error'); return; }

  const btn = document.getElementById('btn-cargar');
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  try {
    const r = await apiPost({
      action: 'addTransaccion',
      data: {
        fecha:        document.getElementById('cargar-fecha').value,
        tipo:         _cargarTipo,
        categoria:    document.getElementById('cargar-cat').value,
        subcategoria: document.getElementById('cargar-subcat').value,
        descripcion:  desc,
        moneda:       document.getElementById('cargar-moneda').value,
        monto:        monto,
        metodoPago:   document.getElementById('cargar-metodo').value,
        notas:        document.getElementById('cargar-notas').value,
      }
    });
    if (r.ok) {
      toast(`✓ ${_cargarTipo} guardado`);
      document.getElementById('cargar-monto').value = '';
      document.getElementById('cargar-desc').value  = '';
      document.getElementById('cargar-notas').value = '';
    } else {
      toast(r.error || 'Error al guardar', 'error');
    }
  } catch(e) {
    toast('Error de conexión', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Guardar movimiento';
  }
}

function renderCharts() {
  if (!_chartData) return;
  const { allTrans, tc } = _chartData;
  if (_chartDonut) { _chartDonut.destroy(); _chartDonut = null; }
  if (_chartBars)  { _chartBars.destroy();  _chartBars  = null; }

  const ctxDonut = document.getElementById('chart-donut');
  const ctxBars  = document.getElementById('chart-bars');
  if (!ctxDonut || !ctxBars) return;

  const hoy = new Date();
  const mes  = hoy.getMonth();
  const anio = hoy.getFullYear();

  // Donut: gastos mes actual por categoría
  const catTotals = {};
  allTrans.filter(t => {
    const f = new Date(t['Fecha']);
    return t['Tipo'] === 'Gasto' && f.getMonth() === mes && f.getFullYear() === anio;
  }).forEach(t => {
    const cat = t['Categoría'] || 'Otros';
    const mARS = t['Moneda'] === 'USD' ? (parseFloat(t['Monto'])||0)*tc : (parseFloat(t['Monto'])||0);
    catTotals[cat] = (catTotals[cat]||0) + mARS;
  });
  const donutLabels = Object.keys(catTotals);
  const donutData   = Object.values(catTotals);
  const palette     = ['#4361ee','#7209b7','#f72585','#3a0ca3','#4cc9f0','#4895ef','#2a9d8f','#e76f51','#e9c46a','#560bad'];

  const t2 = cssVar('--text2');
  const bd = cssVar('--border');

  if (donutLabels.length) {
    _chartDonut = new Chart(ctxDonut, {
      type: 'doughnut',
      data: {
        labels: donutLabels,
        datasets: [{ data: donutData, backgroundColor: palette.slice(0, donutLabels.length), borderWidth: 0, hoverOffset: 6 }]
      },
      options: {
        cutout: '62%',
        plugins: {
          legend: { position:'right', labels:{ color:t2, font:{family:'Hanken Grotesk',size:11}, boxWidth:10, padding:10 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${fmtARS(ctx.parsed)}` } }
        },
        responsive: true, maintainAspectRatio: false,
      }
    });
  } else {
    ctxDonut.parentElement.innerHTML = '<div class="empty" style="padding:2rem"><div class="empty-text">Sin gastos este mes</div></div>';
  }

  // Barras: últimos 6 meses
  const meses = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    meses.push({ key: `${d.getFullYear()}-${d.getMonth()}`, label: d.toLocaleDateString('es-AR',{month:'short'}), ingresos: 0, gastos: 0 });
  }
  allTrans.forEach(t => {
    const f   = new Date(t['Fecha']);
    const key = `${f.getFullYear()}-${f.getMonth()}`;
    const m   = meses.find(x => x.key === key);
    if (!m) return;
    const mARS = t['Moneda'] === 'USD' ? (parseFloat(t['Monto'])||0)*tc : (parseFloat(t['Monto'])||0);
    t['Tipo'] === 'Ingreso' ? (m.ingresos += mARS) : (m.gastos += mARS);
  });

  const green = cssVar('--green');
  const red   = cssVar('--red');

  _chartBars = new Chart(ctxBars, {
    type: 'bar',
    data: {
      labels: meses.map(m => m.label),
      datasets: [
        { label:'Ingresos', data: meses.map(m=>m.ingresos), backgroundColor: green+'33', borderColor: green, borderWidth:1, borderRadius:4 },
        { label:'Gastos',   data: meses.map(m=>m.gastos),   backgroundColor: red+'33',   borderColor: red,   borderWidth:1, borderRadius:4 },
      ]
    },
    options: {
      plugins: {
        legend: { labels:{ color:t2, font:{family:'Hanken Grotesk',size:11}, boxWidth:10 } },
        tooltip: { callbacks:{ label: ctx => ` ${ctx.dataset.label}: ${fmtARS(ctx.parsed.y)}` } }
      },
      scales: {
        x: { grid:{display:false}, ticks:{color:t2, font:{family:'Hanken Grotesk',size:11}} },
        y: { grid:{color:bd}, ticks:{color:t2, font:{family:'Hanken Grotesk',size:11}, callback: v => fmtARS(v)} },
      },
      responsive: true, maintainAspectRatio: false,
    }
  });
}

    const y = new Date().getFullYear();

    document.getElementById('filter-mes').value = new Date().getMonth() + 1;
  }

  const params = { action: 'getTransacciones' };
  const mes  = document.getElementById('filter-mes').value;
  const anio = document.getElementById('filter-anio').value;

async function editTransaccion(t) {
  document.getElementById('modal-trans-title').textContent = 'Editar Transacción';
  document.getElementById('t-fecha').value   = t['Fecha']?.split('T')[0] || today();
  document.getElementById('t-tipo').value    = t['Tipo'];
  document.getElementById('t-moneda').value  = t['Moneda'];
  document.getElementById('t-monto').value   = t['Monto'];
  document.getElementById('t-desc').value    = t['Descripción']||'';
  document.getElementById('t-metodo').value  = t['Método de Pago']||'Efectivo';
  document.getElementById('t-notas').value   = t['Notas']||'';
  await fillCatSelect('t-cat', t['Tipo']);
  document.getElementById('t-cat').value = t['Categoría'];
  await updateSubcat('t-cat','t-subcat');
  document.getElementById('t-subcat').value  = t['Subcategoría'];
  document.getElementById('modal-trans').dataset.editId = t['ID'];
  openModal('modal-trans');
}

async function saveTransaccion() {
  const editId = document.getElementById('modal-trans').dataset.editId;
  const data = {
    fecha: document.getElementById('t-fecha').value, tipo: document.getElementById('t-tipo').value,
    categoria: document.getElementById('t-cat').value, subcategoria: document.getElementById('t-subcat').value,
    descripcion: document.getElementById('t-desc').value, moneda: document.getElementById('t-moneda').value,
    monto: document.getElementById('t-monto').value, metodoPago: document.getElementById('t-metodo').value,
    notas: document.getElementById('t-notas').value,
  };
  if (!data.monto || !data.descripcion) { toast('Completá descripción y monto', 'error'); return; }
  const action = editId ? 'updateTransaccion' : 'addTransaccion';
  if (editId) { data.id = editId; delete document.getElementById('modal-trans').dataset.editId; }
  await apiPost({ action, data });
  closeModal('modal-trans');
  toast('✓ Transacción guardada');
  loadMovimientos();
}

async function delTransaccion(id) {
  if (!await confirmDialog('¿Eliminar esta transacción?')) return;
  await apiPost({ action: 'deleteTransaccion', id });
  toast('Transacción eliminada', 'warn');
  loadMovimientos();
}

      </div></td>
    </tr>`).join('')}</tbody>
  </table></div>
  ${renderCuotasProjection(rows, tc)}`;

function renderCuotasProjection(cuotas, tc) {
  const hoy    = new Date();
  const meses  = [];
  for (let i = 0; i < 6; i++) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() + i, 1);
    meses.push({ key:`${d.getFullYear()}-${d.getMonth()}`, label: d.toLocaleDateString('es-AR',{month:'long',year:'numeric'}), items:[], totalARS:0 });
  }

  let totalComprometidoARS = 0;
  cuotas.forEach(c => {
    const actual  = parseInt(c['Cuota Nº']) || 1;
    const total   = parseInt(c['Total Cuotas']) || 1;
    const monto   = parseFloat(c['Monto por Cuota']) || 0;
    const montoARS = c['Moneda'] === 'USD' ? monto * tc : monto;
    const restantes = total - actual + 1;
    totalComprometidoARS += montoARS * restantes;
    const proxVenc = new Date(c['Próximo Vencimiento']);
    for (let n = 0; n < restantes; n++) {
      const fecha = new Date(proxVenc.getFullYear(), proxVenc.getMonth() + n, proxVenc.getDate());
      const key   = `${fecha.getFullYear()}-${fecha.getMonth()}`;
      const mes   = meses.find(m => m.key === key);
      if (mes) { mes.items.push(c['Descripción']); mes.totalARS += montoARS; }
    }
  });

  return `<div class="proj-section">
    <div class="section-label">Proyección de cuotas</div>
    <div class="flex-between mb" style="font-size:.82rem">
      <span style="color:var(--text2)">Total comprometido pendiente</span>
      <span class="td-mono" style="font-weight:600">${fmtARS(totalComprometidoARS)}</span>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Mes</th><th>Cuotas activas</th><th class="td-right">Total estimado (ARS)</th></tr></thead>
      <tbody>${meses.map(m=>`<tr>
        <td style="font-weight:500;text-transform:capitalize">${m.label}</td>
        <td style="font-size:.76rem;color:var(--text2)">${m.items.length ? m.items.join(', ') : '—'}</td>
        <td class="td-right td-mono">${m.totalARS > 0 ? fmtARS(m.totalARS) : '—'}</td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}
